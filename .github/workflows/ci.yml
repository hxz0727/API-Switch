name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        run: go build -v -o api-switch ./cmd/api-switch/

      - name: Check binary
        run: |
          file api-switch
          ./api-switch --help

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -race ./...

  release:
    name: Release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          name="api-switch-${{ matrix.goos }}-${{ matrix.goarch }}$ext"
          go build -v -ldflags="-s -w" -o "$name" ./cmd/api-switch/
          echo "artifact=$name" >> $GITHUB_ENV

      - name: Compress
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${artifact}.zip" "$artifact"
          else
            tar czf "${artifact}.tar.gz" "$artifact"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-switch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: api-switch-*

  create-release:
    name: Create Release
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        run: |
          echo "## API-Switch ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "### Downloads" >> release-notes.md
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort | while read f; do
            base=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            echo "- \`$base\` ($size)" >> release-notes.md
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/**/*
          generate_release_notes: false
