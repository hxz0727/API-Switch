linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
  disable:
    - godox
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - lll

linters-settings:
  staticcheck:
    checks: ["all"]
  errcheck:
    check-type-assertions: false

issues:
  exclude-use-default: false
  max-same-issues: 0

run:
  timeout: 5m
